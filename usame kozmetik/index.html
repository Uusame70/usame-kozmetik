<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Modern Mağazam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        header {
            background-color: rgba(15, 23, 42, 0.95);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span { color: #38bdf8; }

        .cart-status {
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid #38bdf8;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .cart-status:hover {
            transform: scale(1.05);
            background: #334155;
        }

        .hero { padding: 40px 0; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        h2 { 
            margin-bottom: 30px; 
            font-size: 28px; 
            text-align: center; 
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        @media (max-width: 600px) {
            .product-grid { 
                grid-template-columns: 1fr;
                gap: 20px; 
            }
        }

        .product-card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-card:hover { transform: translateY(-5px); }

        .image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-box { 
            padding: 20px; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .price {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            margin: 10px 0 15px;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background: #0ea5e9; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #38bdf8;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
        }

        /* Ürün Detay Modalı Özel Stilleri */
        .detail-img-box {
            width: 100%;
            max-height: 300px;
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .detail-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-thumbs {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
            overflow-x: auto;
            justify-content: center;
        }

        .gallery-thumbs img {
            width: 45px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .gallery-thumbs img:hover { border-color: #38bdf8; }

        .detail-desc {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #334155;
        }

        /* Sepet Satırları + Adet Butonları */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .cart-item img {
            width: 40px;
            height: 55px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cart-item-info {
            flex-grow: 1;
            margin-left: 15px;
            text-align: left;
        }

        .cart-item-info h4 { font-size: 15px; color: #f8fafc; }
        .cart-item-info p { font-size: 13px; color: #38bdf8; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 15px;
        }

        .qty-btn {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: #38bdf8; color: #0f172a; }

        .admin-panel {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #38bdf8;
            text-align: center;
        }

        .admin-panel input, .admin-panel textarea {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            width: calc(100% - 10px);
            max-width: 400px;
        }

        .admin-panel textarea {
            resize: vertical;
            height: 60px;
        }

        .edit-btn {
            background: #f59e0b !important;
            color: white;
        }

        .delete-btn {
            background: #ef4444 !important;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">MAĞAZAM<span>.</span></div>
            <div class="cart-status" onclick="sepetiAc()">
                <i class="fa-solid fa-cart-shopping"></i>
                🛒 Sepet: <span id="sepet-sayi">0</span> Ürün | <span id="toplam-fiyat">0</span> TL
            </div>
        </div>
    </header>

    <main class="hero">
        <div class="container">
            <h2>Yeni Sezon Koleksiyonu</h2>

            <div id="admin-panel" class="admin-panel">
                <h3 id="form-baslik" style="margin-bottom:15px; color:#38bdf8;">🛠️ Admin Paneli: Yeni Ürün Ekle</h3>
                <input type="hidden" id="edit-urun-id">
                <input type="text" id="yeni-ad" placeholder="Ürün Adı"><br>
                <input type="number" id="yeni-fiyat" placeholder="Fiyat (TL)"><br>
                <textarea id="yeni-aciklama" placeholder="Ürün Açıklaması"></textarea><br>
                <label style="color:white; font-size:14px;">Fotoğraflar Seç (CTRL ile çoklu seç, Max 10): </label><br>
                <input type="file" id="yeni-resim-files" accept="image/*" multiple style="color:white; margin-top:5px; width:auto;"><br><br>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button id="btn-urun-kaydet" onclick="yeniUrunEkle()" style="background:#10b981; color:white; width:180px;">Ürünü Ekle</button>
                    <button id="btn-iptal" onclick="formSifirla()" style="background:#64748b; color:white; width:120px; display:none;">İptal</button>
                </div>
            </div>

            <div class="product-grid" id="urun-listesi"></div>
        </div>
    </main>

    <div id="detail-modal" class="modal">
        <div class="modal-box" style="text-align:center;">
            <div class="detail-img-box">
                <img id="detail-main-img" src="" alt="">
            </div>
            <div id="detail-thumbs" class="gallery-thumbs"></div>
            <h3 id="detail-title" style="color:#f8fafc; font-size:20px;"></h3>
            <p id="detail-price" style="color:#38bdf8; font-size:22px; font-weight:bold; margin:8px 0;"></p>
            <div id="detail-desc" class="detail-desc"></div>
            <button id="detail-add-cart-btn" style="background:#10b981; color:white; margin-bottom:8px;">Sepete Ekle</button>
            <button onclick="modalKapat('detail-modal')" style="background:#64748b; color:white;">Kapat</button>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:#38bdf8; margin-bottom:15px; text-align:center;">🛍️ Sepetinizdeki Ürünler</h3>
            <div id="sepet-icerik"></div>
            <hr style="border-color:#334155; margin:15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom:15px;">
                <span>Toplam Tutar:</span>
                <span id="sepet-modal-toplam" style="color:#38bdf8;">0 TL</span>
            </div>
            <button onclick="siparisVer()" style="background:#10b981; color:white; margin-bottom:8px;">Siparişi Tamamla</button>
            <button onclick="sepetiTemizle()" style="background:#ef4444; color:white; margin-bottom:8px;">Sepeti Temizle</button>
            <button onclick="sepetiKapat()" style="background:#64748b; color:white;">Kapat</button>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-box" style="text-align:center; max-width:320px;">
            <h3 style="color:#38bdf8; margin-bottom:15px;">🔐 Admin Girişi</h3>
            <input type="text" id="username" placeholder="Kullanıcı Adı" style="width:100%; padding:10px; margin:5px 0; background:#0f172a; color:white; border:1px solid #334155; border-radius:5px;">
            <input type="password" id="password" placeholder="Şifre" style="width:100%; padding:10px; margin:5px 0; background:#0f172a; color:white; border:1px solid #334155; border-radius:5px;">
            <button onclick="adminGirisYap()" style="margin-top:10px;">Giriş Yap</button>
            <button onclick="modalKapat('login-modal')" style="background:#ef4444; color:white; margin-top:5px;">İptal</button>
        </div>
    </div>

    <script>
        const varsayilanUrunler = [
            { id: 1, ad: "Premium Ürün 01", fiyat: 750, aciklama: "Yüksek kaliteli özel kumaştan üretilmiştir. Günlük kullanım için son derece konforlu ve modern bir tasarıma sahiptir.", resimler: ["https://via.placeholder.com/300x400/1e293b/38bdf8?text=Urun+1"] },
            { id: 2, ad: "Exclusive Ürün 02", fiyat: 1200, aciklama: "Özel tasarım sınırlı sayıdaki koleksiyonumuzun bir parçasıdır. Dayanıklı yapısıyla uzun ömürlü kullanım sunar.", resimler: ["https://via.placeholder.com/300x400/1e293b/38bdf8?text=Urun+2"] }
        ];

        let urunler = [];
        let sepet = [];
        let isAdmin = false;

        window.onload = function() {
            let kayitliUrunler = localStorage.getItem('magaza_urunler');
            if (kayitliUrunler) {
                urunler = JSON.parse(kayitliUrunler);
            } else {
                urunler = varsayilanUrunler;
                localStorage.setItem('magaza_urunler', JSON.stringify(urunler));
            }

            let kayitliSepet = localStorage.getItem('magaza_sepet');
            if (kayitliSepet) {
                sepet = JSON.parse(kayitliSepet);
            }

            urunleriEkranaBas();
            sepetiGuncelle();
        };

        function urunleriEkranaBas() {
            let grid = document.getElementById('urun-listesi');
            grid.innerHTML = '';

            urunler.forEach((u) => {
                let displayAdmin = isAdmin ? 'flex' : 'none';

                let card = `
                    <div class="product-card" onclick="urunDetayAc(${u.id})">
                        <div class="image-box">
                            <img src="${u.resimler ? u.resimler[0] : ''}" alt="${u.ad}">
                        </div>
                        <div class="info-box">
                            <div>
                                <h3>${u.ad}</h3>
                            </div>
                            <div>
                                <p class="price">${u.fiyat} TL</p>
                                <button type="button" onclick="event.stopPropagation(); sepeteEkle(${u.id})">Sepete Ekle</button>
                                <div class="admin-actions" style="display:${displayAdmin};">
                                    <button type="button" class="edit-btn" onclick="event.stopPropagation(); urunDuzenleForm(${u.id})">Düzenle</button>
                                    <button type="button" class="delete-btn" onclick="event.stopPropagation(); urunSil(${u.id})">Sil</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // ÜRÜN DETAY MODALINI AÇ
        function urunDetayAc(id) {
            let urun = urunler.find(u => u.id === id);
            if (!urun) return;

            document.getElementById('detail-main-img').src = urun.resimler[0];
            document.getElementById('detail-title').innerText = urun.ad;
            document.getElementById('detail-price').innerText = urun.fiyat + " TL";
            document.getElementById('detail-desc').innerText = urun.aciklama || "Açıklama bulunmuyor.";

            let thumbsContainer = document.getElementById('detail-thumbs');
            thumbsContainer.innerHTML = '';

            if (urun.resimler && urun.resimler.length > 1) {
                urun.resimler.forEach(src => {
                    thumbsContainer.innerHTML += `<img src="${src}" onclick="document.getElementById('detail-main-img').src='${src}'">`;
                });
            }

            let addBtn = document.getElementById('detail-add-cart-btn');
            addBtn.onclick = function() {
                sepeteEkle(urun.id);
                modalKapat('detail-modal');
            };

            document.getElementById('detail-modal').style.display = 'flex';
        }

        function sepeteEkle(id) {
            let varOlanUrun = sepet.find(item => item.id === id);
            
            if (varOlanUrun) {
                varOlanUrun.adet += 1;
            } else {
                let urun = urunler.find(u => u.id === id);
                if (urun) {
                    sepet.push({ ...urun, adet: 1 });
                }
            }

            localStorage.setItem('magaza_sepet', JSON.stringify(sepet));
            sepetiGuncelle();
            alert("Ürün sepete eklendi!");
        }

        function sepetiGuncelle() {
            let toplamAdet = sepet.reduce((sum, item) => sum + item.adet, 0);
            let toplamFiyat = sepet.reduce((sum, item) => sum + (item.fiyat * item.adet), 0);

            document.getElementById('sepet-sayi').innerText = toplamAdet;
            document.getElementById('toplam-fiyat').innerText = toplamFiyat;
            document.getElementById('sepet-modal-toplam').innerText = toplamFiyat + " TL";
        }

        function sepetiAc() {
            let icerik = document.getElementById('sepet-icerik');
            icerik.innerHTML = '';

            if (sepet.length === 0) {
                icerik.innerHTML = '<p style="text-align:center; color:#94a3b8;">Sepetiniz boş.</p>';
            } else {
                sepet.forEach((u) => {
                    let itemHtml = `
                        <div class="cart-item">
                            <img src="${u.resimler ? u.resimler[0] : ''}" alt="${u.ad}">
                            <div class="cart-item-info">
                                <h4>${u.ad}</h4>
                                <p>${u.fiyat} TL x ${u.adet} = <b>${u.fiyat * u.adet} TL</b></p>
                            </div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="adetDegistir(${u.id}, -1)">-</button>
                                <span style="font-weight:bold;">${u.adet}</span>
                                <button class="qty-btn" onclick="adetDegistir(${u.id}, 1)">+</button>
                            </div>
                            <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="sepettenTamamenSil(${u.id})"></i>
                        </div>
                    `;
                    icerik.innerHTML += itemHtml;
                });
            }

            document.getElementById('cart-modal').style.display = 'flex';
        }

        function adetDegistir(id, degisim) {
            let item = sepet.find(i => i.id === id);
            if (item) {
                item.adet += degisim;
                if (item.adet <= 0) {
                    sepet = sepet.filter(i => i.id !== id);
                }
                localStorage.setItem('magaza_sepet', JSON.stringify(sepet));
                sepetiGuncelle();
                sepetiAc();
            }
        }

        function sepettenTamamenSil(id) {
            sepet = sepet.filter(i => i.id !== id);
            localStorage.setItem('magaza_sepet', JSON.stringify(sepet));
            sepetiGuncelle();
            sepetiAc();
        }

        function sepetiKapat() { document.getElementById('cart-modal').style.display = 'none'; }

        function sepetiTemizle() {
            sepet = [];
            localStorage.removeItem('magaza_sepet');
            sepetiGuncelle();
            sepetiAc();
        }

        function siparisVer() {
            if(sepet.length === 0) {
                alert("Sepetiniz boş!");
                return;
            }
            alert("Siparişiniz başarıyla alındı! Teşekkür ederiz.");
            sepetiTemizle();
            sepetiKapat();
        }

        // Shift + Alt + M Kısayolu
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && e.altKey && (e.key === 'M' || e.key === 'm')) {
                document.getElementById('login-modal').style.display = 'flex';
            }
        });

        function modalKapat(id) { document.getElementById(id).style.display = 'none'; }

        function adminGirisYap() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if (user === "usame" && pass === "1u2u3u4u5u.U") {
                alert("Giriş Başarılı! Admin moduna geçildi.");
                isAdmin = true;
                modalKapat('login-modal');
                document.getElementById('admin-panel').style.display = 'block';
                urunleriEkranaBas();
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
            }
        }

        function yeniUrunEkle() {
            let editId = document.getElementById('edit-urun-id').value;
            let ad = document.getElementById('yeni-ad').value;
            let fiyat = parseInt(document.getElementById('yeni-fiyat').value);
            let aciklama = document.getElementById('yeni-aciklama').value;
            let resimInput = document.getElementById('yeni-resim-files');

            if(!ad || !fiyat) {
                alert("Lütfen Ürün Adı ve Fiyatı alanlarını doldurun!");
                return;
            }

            let files = Array.from(resimInput.files);

            if (files.length === 0 && editId) {
                let mevcutUrun = urunler.find(u => u.id == editId);
                kaydetUrun(editId, ad, fiyat, aciklama, mevcutUrun.resimler);
                return;
            }

            if(files.length === 0 && !editId) {
                alert("Lütfen en az 1 resim seçin!");
                return;
            }

            if(files.length > 10) files = files.slice(0, 10);

            let resimUrlDizisi = [];
            let okunanSayi = 0;

            files.forEach((file) => {
                let reader = new FileReader();
                reader.onload = function(e) {
                    resimUrlDizisi.push(e.target.result);
                    okunanSayi++;

                    if(okunanSayi === files.length) {
                        kaydetUrun(editId, ad, fiyat, aciklama, resimUrlDizisi);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function kaydetUrun(editId, ad, fiyat, aciklama, resimler) {
            if (editId) {
                let urun = urunler.find(u => u.id == editId);
                if (urun) {
                    urun.ad = ad;
                    urun.fiyat = fiyat;
                    urun.aciklama = aciklama;
                    urun.resimler = resimler;
                }
                alert("Ürün başarıyla güncellendi!");
            } else {
                let yeniUrun = {
                    id: Date.now(),
                    ad: ad,
                    fiyat: fiyat,
                    aciklama: aciklama,
                    resimler: resimler
                };
                urunler.push(yeniUrun);
                alert("Yeni ürün eklendi!");
            }

            localStorage.setItem('magaza_urunler', JSON.stringify(urunler));
            formSifirla();
            urunleriEkranaBas();
        }

        function urunDuzenleForm(id) {
            let urun = urunler.find(u => u.id === id);
            if (!urun) return;

            document.getElementById('edit-urun-id').value = urun.id;
            document.getElementById('yeni-ad').value = urun.ad;
            document.getElementById('yeni-fiyat').value = urun.fiyat;
            document.getElementById('yeni-aciklama').value = urun.aciklama || '';
            
            document.getElementById('form-baslik').innerText = "✏️ Admin Paneli: Ürünü Düzenle";
            document.getElementById('btn-urun-kaydet').innerText = "Güncelle";
            document.getElementById('btn-iptal').style.display = "inline-block";

            document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
        }

        function formSifirla() {
            document.getElementById('edit-urun-id').value = '';
            document.getElementById('yeni-ad').value = '';
            document.getElementById('yeni-fiyat').value = '';
            document.getElementById('yeni-aciklama').value = '';
            document.getElementById('yeni-resim-files').value = '';

            document.getElementById('form-baslik').innerText = "🛠️ Admin Paneli: Yeni Ürün Ekle";
            document.getElementById('btn-urun-kaydet').innerText = "Ürünü Ekle";
            document.getElementById('btn-iptal').style.display = "none";
        }

        function urunSil(id) {
            if(confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                urunler = urunler.filter(u => u.id !== id);
                localStorage.setItem('magaza_urunler', JSON.stringify(urunler));
                urunleriEkranaBas();
            }
        }
    </script>
</body>
</html>
