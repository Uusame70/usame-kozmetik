<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر ميار كوزمتيك</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #E8C766;
            --gold-dark: #B8942E;
            --sky: #87CEEB;
            --sky-light: #B0E0E6;
            --sky-dark: #5BA8C7;
            --navy: #1a2942;
            --navy-light: #2c3e50;
            --cream: #FAFAF8;
            --white: #FFFFFF;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --danger: #e74c3c;
            --success: #27ae60;
            --shadow-sm: 0 2px 8px rgba(26, 41, 66, 0.06);
            --shadow-md: 0 4px 16px rgba(26, 41, 66, 0.08);
            --shadow-lg: 0 8px 32px rgba(26, 41, 66, 0.12);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--cream); color: var(--text); padding-bottom: 100px;
               font-weight: 500; line-height: 1.6; }

        /* ═══ Loading Screen ═══ */
        #loadingScreen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; font-size: 1.1rem; color: var(--gold); font-weight: 700;
            transition: opacity 0.4s ease;
        }
        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid var(--gold);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 0.9s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══ Hero Banner ═══ */
        .hero {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, var(--sky-dark) 100%);
            padding: 40px 20px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 30px 30px;
            box-shadow: var(--shadow-lg);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -20%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(135, 206, 235, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .hero-logo {
            width: 90px; height: 90px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.4rem; font-weight: 900; color: var(--navy);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            position: relative; z-index: 1;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        .hero-logo-img {
            width: 90px; height: 90px;
            margin: 0 auto 16px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            position: relative; z-index: 1;
            border: 3px solid rgba(212, 175, 55, 0.5);
            display: none;
        }
        .hero-title {
            font-size: 1.6rem; font-weight: 900;
            color: var(--white);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            position: relative; z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--sky-light);
            font-weight: 500;
            position: relative; z-index: 1;
            letter-spacing: 0.3px;
        }

        /* ═══ Header (Search + Cart) ═══ */
        header {
            background-color: var(--white);
            padding: 12px 15px;
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow-sm);
            border-bottom: 2px solid var(--gold);
        }
        .header-top { display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 10px; gap: 10px; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .cart-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%) !important;
            color: var(--navy) !important;
            font-weight: 700 !important;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3) !important;
            border-radius: var(--radius-sm) !important;
        }
        .search-box { width: 100%; }
        .search-box input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e8ecf0;
            border-radius: var(--radius-md);
            font-size: 0.95rem; outline: none;
            background-color: var(--cream);
            font-family: inherit; font-weight: 500;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--gold);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        /* ═══ Categories Bar ═══ */
        .categories-bar {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 12px 15px;
            background: var(--white);
            scrollbar-width: thin;
            border-bottom: 1px solid #e8ecf0;
        }
        .categories-bar::-webkit-scrollbar { height: 3px; }
        .categories-bar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
        .cat-btn {
            background-color: var(--cream);
            color: var(--navy);
            border: 2px solid transparent;
            padding: 8px 18px; border-radius: 25px;
            white-space: nowrap; font-size: 0.85rem;
            font-weight: 700; cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .cat-btn:hover { border-color: var(--gold); }
        .cat-btn.active {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--navy);
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        /* ═══ Buttons ═══ */
        button {
            cursor: pointer; padding: 10px 14px; border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: var(--white);
            font-weight: 700; font-size: 0.85rem;
            touch-action: manipulation;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(26, 41, 66, 0.15);
        }
        button:active { transform: scale(0.97); }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26, 41, 66, 0.2); }
        button.btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        button.btn-success { background: linear-gradient(135deg, #27ae60, #229954); }
        button.btn-warning { background: linear-gradient(135deg, #f39c12, #d68910); }
        button.btn-whatsapp { background: linear-gradient(135deg, #25d366, #1ebd59); }
        button.btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--navy);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        /* ═══ Container ═══ */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        /* ═══ Admin Bar ═══ */
        .admin-bar {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(135, 206, 235, 0.1));
            border: 2px solid var(--gold);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .sync-info { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
        .badge-admin {
            background: var(--gold); color: var(--navy);
            padding: 3px 10px; border-radius: 12px;
            font-size: 0.7rem; font-weight: 800;
            margin-inline-start: 8px;
        }

        /* ═══ Section Titles ═══ */
        .section-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--navy);
            margin: 25px 0 18px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--gold);
            display: inline-block;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -3px; left: 0;
            width: 40px; height: 3px;
            background: var(--sky);
            border-radius: 3px;
        }

        /* ═══ Products Grid ═══ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        @media (max-width: 900px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
        @media (max-width: 500px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .product-card img { height: 140px !important; }
            .product-info { padding: 10px !important; }
            .product-title { font-size: 0.9rem !important; }
            .product-actions { flex-direction: column; }
            .product-actions button { width: 100%; padding: 8px 5px; }
            .hero-title { font-size: 1.3rem; }
        }

        /* ═══ Product Card ═══ */
        .product-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column;
            position: relative;
            transition: all 0.3s;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .product-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: var(--gold);
        }
        .product-badge-discount {
            position: absolute; top: 10px; left: 10px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 5px 10px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 800;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }
        .product-card img {
            width: 100%; height: 220px;
            object-fit: contain;
            background: linear-gradient(135deg, #f8fafc, #eef4f8);
            cursor: pointer;
            transition: transform 0.4s;
        }
        .product-card:hover img { transform: scale(1.05); }
        .product-info {
            padding: 14px;
            flex-grow: 1;
            display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 1rem; margin-bottom: 8px;
            color: var(--navy); font-weight: 700;
            cursor: pointer;
            line-height: 1.4;
        }
        .price-row {
            display: flex; align-items: baseline;
            gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .product-price {
            font-size: 1.15rem; font-weight: 900;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .product-price-old {
            font-size: 0.85rem; color: var(--text-light);
            text-decoration: line-through; font-weight: 500;
        }
        .product-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .product-actions button { font-size: 0.78rem; padding: 8px 6px; }

        /* ═══ Cart Bar ═══ */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: var(--white);
            padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 -4px 20px rgba(26, 41, 66, 0.3);
            z-index: 90;
            border-top: 3px solid var(--gold);
        }
        .cart-bar-info { font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .cart-bar-info strong {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 900;
        }
        .cart-bar .btn-success {
            background: linear-gradient(135deg, #25d366 0%, #1ebd59 100%);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }

        /* ═══ Scroll Top Button ═══ */
        #scrollTopBtn {
            position: fixed; bottom: 90px; right: 20px;
            display: none; z-index: 99;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--navy);
            border: none; border-radius: 50%;
            width: 52px; height: 52px;
            font-size: 24px; cursor: pointer;
            line-height: 1; padding: 0;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            font-weight: 900;
            transition: all 0.3s;
        }
        #scrollTopBtn:hover {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.6);
        }

        /* ═══ Modal ═══ */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(26, 41, 66, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
            z-index: 1000; padding: 15px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 100%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border-top: 4px solid var(--gold);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header-row {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 18px;
        }
        .modal-content h2 {
            font-size: 1.3rem; font-weight: 900; color: var(--navy);
        }
        .modal-actions {
            display: flex; justify-content: flex-end;
            gap: 10px; margin-top: 18px; flex-wrap: wrap;
        }

        /* ═══ Forms ═══ */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            font-weight: 700; font-size: 0.9rem;
            color: var(--navy);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 14px;
            border: 2px solid #e8ecf0;
            border-radius: var(--radius-sm);
            font-size: 16px; font-family: inherit;
            background: var(--cream);
            font-weight: 500;
            transition: all 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .price-hint { font-size: 0.75rem; color: var(--text-light); margin-top: 5px; font-weight: 500; }

        /* ═══ Password ═══ */
        .password-row { display: flex; gap: 6px; }
        .password-row input { flex-grow: 1; }
        .toggle-pass-btn {
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            padding: 0 16px; font-size: 1.1rem;
            min-width: 52px;
            display: flex; align-items: center; justify-content: center;
        }

        /* ═══ Image Preview ═══ */
        .img-preview {
            width: 100%; max-height: 220px;
            object-fit: contain;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            background: var(--cream);
            display: none;
            border: 2px solid #e8ecf0;
        }

        /* ═══ Cart Items ═══ */
        .cart-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 12px 0;
            border-bottom: 1px solid #e8ecf0; gap: 10px;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-details { flex-grow: 1; }
        .cart-item-details strong { color: var(--navy); font-weight: 700; }
        .qty-btns { display: flex; gap: 6px; align-items: center; }
        .qty-btns button {
            padding: 4px 12px; font-size: 1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy);
        }
        .btn-remove-item {
            padding: 8px 10px; font-size: 0.85rem;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        /* ═══ Detail Modal ═══ */
        .detail-discount {
            display: inline-block;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 5px 12px; border-radius: 12px;
            font-size: 0.85rem; font-weight: 800;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        #detail-img {
            width: 100%; max-height: 420px; height: auto;
            object-fit: contain;
            background: linear-gradient(135deg, #f8fafc, #eef4f8);
            border-radius: var(--radius-md);
            margin-bottom: 14px;
        }
        #detail-title { color: var(--navy); font-weight: 900; }
        #detail-desc {
            color: var(--text); font-size: 0.95rem;
            line-height: 1.7; margin-bottom: 16px;
            text-align: start;
            background: var(--cream); padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid #e8ecf0;
        }

        /* ═══ Empty State ═══ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-light);
            padding: 40px 20px;
            font-size: 1rem;
            font-weight: 500;
        }

        /* ═══ Footer ═══ */
        .footer {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: var(--white);
            padding: 24px 20px;
            margin-top: 40px;
            text-align: center;
            border-top: 3px solid var(--gold);
            border-radius: 20px 20px 0 0;
        }
        .footer-title {
            font-size: 1.1rem; font-weight: 900;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .footer-text {
            font-size: 0.85rem; color: var(--sky-light);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <span>جاري التحميل...</span>
    </div>

    <!-- ═══ HERO BANNER ═══ -->
    <section class="hero">
        <div class="hero-logo" id="heroLogo">م</div>
        <img class="hero-logo-img" id="heroLogoImg" alt="Logo">
        <h1 class="hero-title" id="heroTitle">متجر ميار كوزمتيك</h1>
        <p class="hero-subtitle">جمالك يبدأ من هنا ✨</p>
    </section>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-top">
            <div class="header-btns">
                <button class="cart-btn" onclick="openModal('cartModal')">🛒 السلة (<span id="cart-count">0</span>)</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="🔍 بحث عن منتج...">
        </div>
    </header>

    <!-- ═══ CATEGORIES ═══ -->
    <div id="categoriesBar" class="categories-bar"></div>

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="container">
        <div id="adminBar" class="admin-bar" style="display: none;">
            <div>
                <span>🔐 <strong style="color: var(--navy);">وضع المسؤول مفعل <span class="badge-admin">ADMIN</span></strong></span>
                <div class="sync-info" id="sync-info"></div>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button onclick="openProductForm()" class="btn-gold">➕ إضافة منتج</button>
                <button onclick="handleSupabaseLogout()" class="btn-danger">🚪 خروج</button>
            </div>
        </div>

        <h2 class="section-title" id="productsTitle">🛍️ المنتجات</h2>
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <!-- ═══ CART BAR ═══ -->
    <div class="cart-bar">
        <div class="cart-bar-info">
            <span>المجموع:</span>
            <strong id="cart-total-price">0</strong>
            <span>₺</span>
        </div>
        <button onclick="completeOrder()" class="btn-success">📱 إرسال الطلب</button>
    </div>

    <button id="scrollTopBtn" title="الأعلى">⬆</button>

    <!-- ═══ FOOTER ═══ -->
    <footer class="footer">
        <div class="footer-title">متجر ميار كوزمتيك</div>
        <div class="footer-text">© 2026 جميع الحقوق محفوظة</div>
    </footer>

    <!-- ═══ PRODUCT DETAIL MODAL ═══ -->
    <div id="productDetailModal" class="modal" onclick="closeModalOnBackdrop(event, 'productDetailModal')">
        <div class="modal-content" style="text-align:center;">
            <img id="detail-img" src="" loading="lazy">
            <div id="detail-discount" class="detail-discount" style="display:none;"></div>
            <h2 id="detail-title" style="margin-bottom:12px;"></h2>
            <p id="detail-desc"></p>
            <div id="detail-price-row" style="margin-bottom:16px;"></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="detail-add-btn" class="btn-success" style="flex-grow:1; padding:12px;">🛒 إضافة للسلة</button>

    <script>
        const SUPABASE_URL = 'https://xmrdqepjtfycvtgcbkyy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MgJhvhCdIg9oC40t--FZxQ_04A8dWkU';

        let _supabase = null;
        let isAdmin = false;
        let sessionToken = null;
        let catalogConfig = { twochat_api_key: '', twochat_phone: '' };

        let cart = JSON.parse(localStorage.getItem('catalog_cart')) || [];
        let currentProducts = [];
        let filteredProducts = [];
        let allCategories = [];
        let selectedCategory = 'ALL';
        let searchQuery = '';
        let searchTimeout = null;
        let currentImageFile = null;
        let currentImageUrl = '';
        let currentImagePreview = '';
        let modalHistoryStack = [];

        function initSupabase() {
            try {
                if (typeof supabase !== 'undefined' && supabase.createClient) {
                    _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (e) { console.error('Supabase init:', e); }
        }

        function togglePasswordVisibility() {
            const inp = document.getElementById('login-password');
            const btn = document.getElementById('btn-toggle-pass');
            if (!inp || !btn) return;
            if (inp.type === 'password') { inp.type = 'text'; btn.innerText = '🙈'; }
            else { inp.type = 'password'; btn.innerText = '👁️'; }
        }

        async function loadCatalogConfig() {
            if (!_supabase) return;
            try {
                const { data } = await _supabase
                    .from('settings')
                    .select('twochat_api_key, twochat_phone')
                    .eq('id', 1)
                    .maybeSingle();
                if (data) {
                    catalogConfig.twochat_api_key = data.twochat_api_key || '';
                    catalogConfig.twochat_phone = data.twochat_phone || '';
                }
            } catch (e) { console.warn('Config:', e); }
        }

        function imageUrl(url) {
            if (!url) return 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect width=%22300%22 height=%22200%22 fill=%22%23f8fafc%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23D4AF37%22 font-family=%22Tajawal,sans-serif%22 font-size=%2216%22 font-weight=%22bold%22 text-anchor=%22middle%22 dy=%22.3em%22>لا صورة</text></svg>';
            if (url.startsWith('/api/b2-image')) return url;
            const supabaseBase = 'https://xmrdqepjtfycvtgcbkyy.supabase.co/storage/v1/object/public/product-images';
            if (url.startsWith(supabaseBase)) return url.replace(supabaseBase, '/storage-img');
            if (url.includes('2chat-user-data.s3') || url.includes('2chat.io')) {
                return '/api/image-proxy?url=' + encodeURIComponent(url);
            }
            return url;
        }

        function parseCategories(str) {
            if (!str) return [];
            return str.split(/[,;\/|]+/).map(s => s.trim()).filter(s => s.length > 0);
        }

        function showLoadingScreen() { document.getElementById('loadingScreen').style.display = 'flex'; }
        function hideLoadingScreen() {
            const ls = document.getElementById('loadingScreen');
            ls.style.opacity = '0';
            setTimeout(() => { ls.style.display = 'none'; }, 400);
        }

        function formatPhoneForWa(phoneStr) {
            let digits = phoneStr.replace(/[^0-9]/g, '');
            if (digits.startsWith('0')) digits = '9' + digits;
            else if (digits.length === 10 && digits.startsWith('5')) digits = '90' + digits;
            return digits;
        }

        function getProductLink(id) {
            return window.location.origin + window.location.pathname + '?product=' + encodeURIComponent(id);
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function copyTextToClipboard(text, msg) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text).then(() => alert(msg)).catch(() => fbCopy(text, msg));
            } else fbCopy(text, msg);
        }
        function fbCopy(text, msg) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); alert(msg); } catch (e) {}
            document.body.removeChild(ta);
        }

        function calcDiscount(p) {
            if (!p.original_price || p.original_price <= p.price) return 0;
            return Math.round(((p.original_price - p.price) / p.original_price) * 100);
        }

        function renderCategories() {
            const bar = document.getElementById('categoriesBar');
            bar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn' + (selectedCategory === 'ALL' ? ' active' : '');
            allBtn.innerText = '✨ الكل';
            allBtn.onclick = () => {
                if (selectedCategory === 'ALL') return;
                selectedCategory = 'ALL'; renderCategories(); applyLocalFilter();
            };
            bar.appendChild(allBtn);

            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn' + (selectedCategory === cat ? ' active' : '');
                btn.innerText = cat;
                btn.onclick = () => {
                    if (selectedCategory === cat) return;
                    selectedCategory = cat; renderCategories(); applyLocalFilter();
                };
                bar.appendChild(btn);
            });

            const datalist = document.getElementById('category-list');
            if (datalist) {
                datalist.innerHTML = '';
                allCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat; datalist.appendChild(opt);
                });
            }
        }

        async function loadCatalog(bust = false) {
            showLoadingScreen();
            try {
                const url = '/api/products' + (bust ? '?bust=1&t=' + Date.now() : '');
                const res = await fetch(url);
                if (!res.ok) throw new Error('API error: ' + res.status);
                const data = await res.json();

                currentProducts = data.products || [];

                const catSet = new Set();
                currentProducts.forEach(p => {
                    parseCategories(p.category || '').forEach(c => catSet.add(c));
                });
                allCategories = Array.from(catSet).sort();

                if (data.lastSync) {
                    const d = new Date(data.lastSync.synced_at);
                    const info = document.getElementById('sync-info');
                    if (info) info.innerText = `آخر مزامنة: ${d.toLocaleString('ar-EG')} (${data.lastSync.total_count} منتج)`;
                }

                renderCategories();
                applyLocalFilter();
            } catch (err) {
                console.error('Catalog:', err);
                document.getElementById('productsGrid').innerHTML =
                    `<p class="empty-state" style="color:#e74c3c;">⚠️ تعذر تحميل البيانات: ${err.message}</p>`;
            } finally { hideLoadingScreen(); }
        }

        function applyLocalFilter() {
            let list = currentProducts.slice();

            if (selectedCategory !== 'ALL') {
                list = list.filter(p => parseCategories(p.category || '').includes(selectedCategory));
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                list = list.filter(p => {
                    const n = ((p.name_ar || '') + (p.name_tr || '') + (p.desc_ar || '') + (p.desc_tr || '')).toLowerCase();
                    return n.includes(q);
                });
            }

            filteredProducts = list;
            renderFilteredProducts();
        }

        function renderFilteredProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="empty-state">لا توجد منتجات</p>`;
                return;
            }
            const frag = document.createDocumentFragment();
            filteredProducts.forEach(p => frag.appendChild(createProductCardElement(p)));
            grid.appendChild(frag);
        }

        function createProductCardElement(p) {
            const name = p.name_ar || p.name_tr || 'منتج';
            const img = imageUrl(p.img);
            const idStr = String(p.id);
            const discount = calcDiscount(p);
            const hasDiscount = discount > 0;

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${hasDiscount ? `<span class="product-badge-discount">-${discount}%</span>` : ''}
                <img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" onclick="openProductDetail('${idStr}')" loading="lazy">
                <div class="product-info">
                    <div>
                        <div class="product-title" onclick="openProductDetail('${idStr}')">${escapeHtml(name)}</div>
                        <div class="price-row">
                            <span class="product-price">${p.price} ₺</span>
                            ${hasDiscount ? `<span class="product-price-old">${p.original_price} ₺</span>` : ''}
                        </div>
                    </div>
                    <div class="product-actions">
                        <button onclick="addToCart('${idStr}')" class="btn-gold" style="flex-grow:1;">🛒 إضافة</button>
                        <button onclick="shareProduct('${idStr}')" class="btn-whatsapp" title="مشاركة">💬</button>
                        <button onclick="copyProductLink('${idStr}')" class="btn-warning" title="نسخ">🔗</button>
                        ${isAdmin ? `
                            <button onclick="openProductForm('${idStr}')" class="btn-warning" title="تعديل">✏️</button>
                            <button onclick="deleteProduct('${idStr}')" class="btn-danger" title="حذف">🗑️</button>
                        ` : ''}
                    </div>
                </div>
            `;
            return card;
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            cartList.innerHTML = '';
            let tQty = 0, tPrice = 0;
            if (cart.length === 0) {
                cartList.innerHTML = `<p style="text-align:center; color:var(--text-light); padding:30px 0; font-weight:500;">السلة فارغة</p>`;
            } else {
                cart.forEach(c => {
                    const prod = currentProducts.find(p => String(p.id) === String(c.id));
                    if (prod) {
                        const name = prod.name_ar || prod.name_tr || 'منتج';
                        const itemTotal = prod.price * c.qty;
                        tQty += c.qty; tPrice += itemTotal;
                        const idStr = String(prod.id);
                        const d = document.createElement('div');
                        d.className = 'cart-item';
                        d.innerHTML = `
                            <div class="cart-item-details">
                                <strong>${escapeHtml(name)}</strong><br>
                                <small style="color:var(--text-light);">${prod.price} ₺ × ${c.qty} = ${itemTotal} ₺</small>
                            </div>
                            <div class="qty-btns">
                                <button onclick="updateQty('${idStr}', -1)">−</button>
                                <span style="font-weight:800; color:var(--navy);">${c.qty}</span>
                                <button onclick="updateQty('${idStr}', 1)">+</button>
                            </div>
                            <button onclick="removeFromCart('${idStr}')" class="btn-remove-item">🗑️</button>
                        `;
                        cartList.appendChild(d);
                    }
                });
            }
            document.getElementById('cart-count').innerText = tQty;
            document.getElementById('cart-total-price').innerText = tPrice;
        }

        function addToCart(id) {
            id = String(id);
            const item = cart.find(c => String(c.id) === id);
            if (item) item.qty++;
            else cart.push({ id, qty: 1 });
            saveCart(); renderCart();
        }
        function updateQty(id, delta) {
            id = String(id);
            const item = cart.find(c => String(c.id) === id);
            if (item) { item.qty += delta; if (item.qty <= 0) cart = cart.filter(c => String(c.id) !== id); }
            saveCart(); renderCart();
        }
        function removeFromCart(id) {
            id = String(id);
            cart = cart.filter(c => String(c.id) !== id);
            saveCart(); renderCart();
        }
        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('هل أنت متأكد من تفريغ السلة؟')) { cart = []; saveCart(); renderCart(); }
        }
        function saveCart() { localStorage.setItem('catalog_cart', JSON.stringify(cart)); }

        function completeOrder() {
            if (cart.length === 0) { alert('السلة فارغة!'); return; }
            let lines = [], tQty = 0, tTotal = 0;
            const orderPhone = catalogConfig.twochat_phone || '905388444275';
            lines.push('🛍️ طلب جديد');
            lines.push('');
            cart.forEach(c => {
                const prod = currentProducts.find(p => String(p.id) === String(c.id));
                if (prod) {
                    const name = prod.name_ar || prod.name_tr || `#${c.id}`;
                    const itemTotal = prod.price * c.qty;
                    tQty += c.qty; tTotal += itemTotal;
                    lines.push(`• ${name}`);
                    lines.push(`  ${prod.price} ₺ × ${c.qty} = ${itemTotal} ₺`);
                }
            });
            lines.push('');
            lines.push(`إجمالي المنتجات: ${tQty}`);
            lines.push(`المبلغ الإجمالي: ${tTotal} ₺`);
            const msg = encodeURIComponent(lines.join('\n'));
            window.open(`https://wa.me/${formatPhoneForWa(orderPhone)}?text=${msg}`, '_blank');
        }

        function openProductDetail(id) {
            id = String(id);
            const p = currentProducts.find(x => String(x.id) === id);
            if (!p) { alert('لم يتم العثور على المنتج'); return; }

                    <span style="font-size:1rem; color:var(--text-light); text-decoration:line-through; margin-inline-start:8px;">${p.original_price} ₺</span>
                `;

                priceRow.innerHTML = `<span style="font-size:1.4rem; font-weight:900; color:var(--gold-dark);">${p.price} ₺</span>`;

            document.getElementById('detail-add-btn').onclick = () => { addToCart(p.id); closeModalAndPopHistory('productDetailModal'); };
            document.getElementById('detail-share-btn').onclick = () => shareProduct(p.id);
            document.getElementById('detail-copy-link-btn').onclick = () => copyProductLink(p.id);
            openModal('productDetailModal');
        }

        function shareProduct(id) {
            id = String(id);
            const p = currentProducts.find(x => String(x.id) === id);
            if (!p) return;
            const name = p.name_ar || p.name_tr || 'منتج';
            const discount = calcDiscount(p);
            let msg = `${name}\n`;
            if (discount > 0) {
                msg += `🔥 خصم ${discount}%\n💰 ${p.price} ₺ بدلاً من ${p.original_price} ₺\n`;
            } else {
                msg += `💰 ${p.price} ₺\n`;

            msg += `🔗 ${getProductLink(id)}`;

        function copyProductLink(id) {
            id = String(id);
            const p = currentProducts.find(x => String(x.id) === id);

            copyTextToClipboard(getProductLink(id), '✅ تم نسخ الرابط');
        }

        function openProductForm(id = null) {
            if (!isAdmin) { alert('يجب تسجيل الدخول أولاً'); return; }

            currentImageFile = null;
            currentImageUrl = '';
            currentImagePreview = '';

            const preview = document.getElementById('pf-image-preview');
            preview.style.display = 'none';
            preview.src = '';
            document.getElementById('pf-image-file').value = '';

            if (id) {
                const p = currentProducts.find(x => String(x.id) === String(id));

                document.getElementById('pf-price').value = p.price || '';

                if (p.img) {
                    currentImageUrl = p.img;

                    preview.src = p.img;
                    preview.style.display = 'block';
                }
            } else {
                document.getElementById('product-form-title').innerText = '➕ إضافة منتج جديد';
                document.getElementById('pf-id').value = '';
                document.getElementById('pf-name').value = '';
                document.getElementById('pf-price').value = '';
                document.getElementById('pf-original-price').value = '';
                document.getElementById('pf-category').value = '';
                document.getElementById('pf-desc').value = '';
            }

            openModal('productFormModal');
        }

        function previewProductImage(input) {
            const file = input.files[0];
            const preview = document.getElementById('pf-image-preview');
            if (file) {
                currentImageFile = file;
                const reader = new FileReader();
                reader.onload = e => {
                    currentImagePreview = e.target.result;
                    preview.src = currentImagePreview;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function compressImage(file, maxWidth = 1000, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => {
                            if (!blob) { resolve(file); return; }
                            resolve(new File([blob], 'image.webp', { type: 'image/webp' }));
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        async function uploadImage(file) {
            if (!isAdmin || !sessionToken) throw new Error('غير مصرح');
            const compressed = await compressImage(file);
            const base64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(compressed);
            });
            const res = await fetch('/api/b2-upload', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + sessionToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ base64, contentType: compressed.type || 'image/webp' })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Upload failed');
            return '/api/b2-image?key=' + encodeURIComponent(data.key);
        }

        async function saveProduct() {
            if (!isAdmin || !_supabase) { alert('غير مصرح'); return; }

            const id = document.getElementById('pf-id').value;
            const name = document.getElementById('pf-name').value.trim();
            const price = parseFloat(document.getElementById('pf-price').value) || 0;
            const originalPrice = parseFloat(document.getElementById('pf-original-price').value) || 0;
            const category = document.getElementById('pf-category').value.trim();
            const desc = document.getElementById('pf-desc').value.trim();

            if (!name) { alert('يجب إدخال اسم المنتج'); return; }
            if (price <= 0) { alert('يجب إدخال سعر صحيح'); return; }
            if (originalPrice > 0 && originalPrice <= price) {
                alert('⚠️ السعر الأصلي يجب أن يكون أكبر من السعر الحالي'); return;
            }

            const btn = document.getElementById('pf-save-btn');
            const oldText = btn.innerText;
            btn.innerText = '⏳ جاري الحفظ...';
            btn.disabled = true;

            try {
                let imgUrl = currentImageUrl;
                if (currentImageFile) imgUrl = await uploadImage(currentImageFile);

                const payload = {
                    name, price, original_price: originalPrice,
                    category, description: desc, img: imgUrl,
                    synced_at: new Date().toISOString()
                };

                if (id) {
                    const { error } = await _supabase.from('whatsapp_products').update(payload).eq('id', id);
                    if (error) throw error;
                    alert('✅ تم تحديث المنتج بنجاح');
                } else {
                    const newId = 'admin_' + Date.now();
                    const { error } = await _supabase.from('whatsapp_products').insert([{ ...payload, id: newId }]);
                    if (error) throw error;
                    alert('✅ تمت إضافة المنتج بنجاح');
                }

                closeModalAndPopHistory('productFormModal');
                await loadCatalog(true);
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
                console.error(err);
            } finally {
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            if (!isAdmin || !_supabase) { alert('غير مصرح'); return; }
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            try {
                const { error } = await _supabase.from('whatsapp_products').delete().eq('id', id);
                if (error) throw error;
                cart = cart.filter(c => String(c.id) !== String(id));
                saveCart(); renderCart();
                alert('✅ تم حذف المنتج');
                await loadCatalog(true);
            } catch (err) { alert('❌ خطأ في الحذف: ' + err.message); }
        }

        function handleSearch(val) {
            if (val.trim() === 'mayar.') {
                document.getElementById('search-input').value = '';
                searchQuery = ''; applyLocalFilter();
                const passInp = document.getElementById('login-password');
                if (passInp) passInp.type = 'password';
                const toggleBtn = document.getElementById('btn-toggle-pass');
                if (toggleBtn) toggleBtn.innerText = '👁️';
                openModal('loginModal');
                setTimeout(() => document.getElementById('login-email')?.focus(), 100);
                return;
            }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = val.trim().toLowerCase();
                applyLocalFilter();
            }, 200);
        }

        async function handleSupabaseLogin() {
            if (!_supabase) { alert('Supabase غير محمل'); return; }
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) { alert('البريد وكلمة المرور مطلوبان'); return; }

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) { alert('❌ خطأ: ' + error.message); return; }

            isAdmin = true;
            sessionToken = data.session?.access_token || null;
            closeModalAndPopHistory('loginModal');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-password').type = 'password';
            document.getElementById('btn-toggle-pass').innerText = '👁️';
            updateAdminUI();
            await loadCatalogConfig();
            renderFilteredProducts();
            alert('✅ تم تسجيل الدخول بنجاح');
        }

        async function handleSupabaseLogout() {
            if (!_supabase) return;
            await _supabase.auth.signOut();
            isAdmin = false; sessionToken = null;
            updateAdminUI(); renderFilteredProducts();
            alert('تم تسجيل الخروج');
        }

        function updateAdminUI() {
            document.getElementById('adminBar').style.display = isAdmin ? 'flex' : 'none';
        }

        // ═══ Modal Yönetimi ═══
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
            if (id !== 'loadingScreen') {
                modalHistoryStack.push(id);
                history.pushState({ modal: id }, '');
            }
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalAndPopHistory(id) {
            closeModal(id);
            const idx = modalHistoryStack.lastIndexOf(id);
            if (idx !== -1) modalHistoryStack.splice(idx, 1);
            if (history.state && history.state.modal === id) history.back();
        }
        function closeModalOnBackdrop(event, modalId) {
            if (event.target.id === modalId) closeModalAndPopHistory(modalId);
        }

        window.addEventListener('popstate', function() {
            if (modalHistoryStack.length > 0) {
                const modalId = modalHistoryStack.pop();
                closeModal(modalId);
            } else {
                history.pushState({ root: true }, '');
            }
        });
        history.replaceState({ root: true }, '');

        document.getElementById('productFormModal')?.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault(); saveProduct();
            }
        });

        async function init() {
            showLoadingScreen();
            initSupabase();

            try {
                if (_supabase) {
                    const { data: { session } } = await _supabase.auth.getSession();
                    isAdmin = !!session;
                    sessionToken = session?.access_token || null;

                    _supabase.auth.onAuthStateChange((event, session) => {
                        isAdmin = !!session;
                        sessionToken = session?.access_token || null;
                        updateAdminUI(); renderFilteredProducts();
                    });
                }

                await loadCatalogConfig();
                await loadCatalog();
            } catch (err) { console.error('Init:', err); hideLoadingScreen(); }

            updateAdminUI();
            renderCart();

            const urlParams = new URLSearchParams(window.location.search);
            const pid = urlParams.get('product');
            if (pid) setTimeout(() => openProductDetail(String(pid)), 500);

            const scrollBtn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', () => {
                scrollBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
            });
            scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        window.onload = init;
    </script>
</body>
