<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الحديث</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            text-align: right;
        }

        header {
            background-color: rgba(15, 23, 42, 0.95);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span { color: #38bdf8; }

        .cart-status {
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid #38bdf8;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .cart-status:hover {
            transform: scale(1.05);
            background: #334155;
        }

        .hero { padding: 40px 0; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        h2 { 
            margin-bottom: 30px; 
            font-size: 28px; 
            text-align: center; 
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        @media (max-width: 600px) {
            .product-grid { 
                grid-template-columns: 1fr;
                gap: 20px; 
            }
        }

        .product-card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-card:hover { transform: translateY(-5px); }

        .image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-box { 
            padding: 20px; 
            text-align: right; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .price {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            margin: 10px 0 15px;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background: #0ea5e9; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #38bdf8;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .detail-img-box {
            width: 100%;
            max-height: 300px;
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .detail-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-thumbs {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
            overflow-x: auto;
            justify-content: center;
        }

        .gallery-thumbs img {
            width: 45px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .gallery-thumbs img:hover { border-color: #38bdf8; }

        .detail-desc {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
            margin: 15px 0;
            text-align: right;
            border: 1px solid #334155;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .cart-item img {
            width: 40px;
            height: 55px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cart-item-info {
            flex-grow: 1;
            margin-right: 15px;
            text-align: right;
        }

        .cart-item-info h4 { font-size: 15px; color: #f8fafc; }
        .cart-item-info p { font-size: 13px; color: #38bdf8; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 15px;
        }

        .qty-btn {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: #38bdf8; color: #0f172a; }

        .admin-panel {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #38bdf8;
            text-align: center;
        }

        .admin-panel input, .admin-panel textarea {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            width: calc(100% - 10px);
            max-width: 400px;
            text-align: right;
        }

        .admin-panel textarea {
            resize: vertical;
            height: 60px;
        }

        .edit-btn {
            background: #f59e0b !important;
            color: white;
        }

        .delete-btn {
            background: #ef4444 !important;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">متجري<span>.</span></div>
            <div class="cart-status" onclick="sepetiAc()">
                <i class="fa-solid fa-cart-shopping"></i>
                🛒 السلة: <span id="sepet-sayi">0</span> منتج | <span id="toplam-fiyat">0</span> ليرة
            </div>
        </div>
    </header>

    <main class="hero">
        <div class="container">
            <h2>تشكيلة الموسم الجديد</h2>

            <div id="admin-panel" class="admin-panel">
                <h3 id="form-baslik" style="margin-bottom:15px; color:#38bdf8;">🛠️ لوحة التحكم: إضافة منتج جديد</h3>
                <input type="hidden" id="edit-urun-id">
                <input type="text" id="yeni-ad" placeholder="اسم المنتج"><br>
                <input type="number" id="yeni-fiyat" placeholder="السعر (ليرة)"><br>
                <textarea id="yeni-aciklama" placeholder="وصف المنتج"></textarea><br>
                <label style="color:white; font-size:14px;">اختر الصور (الحد الأقصى 10): </label><br>
                <input type="file" id="yeni-resim-files" accept="image/*" multiple style="color:white; margin-top:5px; width:auto;"><br><br>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button id="btn-urun-kaydet" onclick="yeniUrunEkle()" style="background:#10b981; color:white; width:180px;">إضافة المنتج</button>
                    <button id="btn-iptal" onclick="formSifirla()" style="background:#64748b; color:white; width:120px; display:none;">إلغاء</button>
                </div>
            </div>

            <div class="product-grid" id="urun-listesi"></div>
        </div>
    </main>

    <div id="detail-modal" class="modal">
        <div class="modal-box" style="text-align:center;">
            <div class="detail-img-box">
                <img id="detail-main-img" src="" alt="">
            </div>
            <div id="detail-thumbs" class="gallery-thumbs"></div>
            <h3 id="detail-title" style="color:#f8fafc; font-size:20px;"></h3>
            <p id="detail-price" style="color:#38bdf8; font-size:22px; font-weight:bold; margin:8px 0;"></p>
            <div id="detail-desc" class="detail-desc"></div>
            <button id="detail-add-cart-btn" style="background:#10b981; color:white; margin-bottom:8px;">إضافة إلى السلة</button>
            <button onclick="modalKapat('detail-modal')" style="background:#64748b; color:white;">إغلاق</button>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:#38bdf8; margin-bottom:15px; text-align:center;">🛍️ المنتجات في سلتك</h3>
            <div id="sepet-icerik"></div>
            <hr style="border-color:#334155; margin:15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom:15px;">
                <span>المجموع الكلي:</span>
                <span id="sepet-modal-toplam" style="color:#38bdf8;">0 ليرة</span>
            </div>
            <button onclick="siparisVer()" style="background:#10b981; color:white; margin-bottom:8px;">إتمام الطلب</button>
            <button onclick="sepetiTemizle()" style="background:#ef4444; color:white; margin-bottom:8px;">إفراغ السلة</button>
            <button onclick="sepetiKapat()" style="background:#64748b; color:white;">إغلاق</button>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-box" style="text-align:center; max-width:320px;">
            <h3 style="color:#38bdf8; margin-bottom:15px;">🔐 تسجيل دخول المشرف</h3>
            <input type="text" id="username" placeholder="اسم المستخدم" style="width:100%; padding:10px; margin:5px 0; background:#0f172a; color:white; border:1px solid #334155; border-radius:5px; text-align:right;">
            <input type="password" id="password" placeholder="كلمة المرور" style="width:100%; padding:10px; margin:5px 0; background:#0f172a; color:white; border:1px solid #334155; border-radius:5px; text-align:right;">
            <button onclick="adminGirisYap()" style="margin-top:10px;">تسجيل الدخول</button>
            <button onclick="modalKapat('login-modal')" style="background:#ef4444; color:white; margin-top:5px;">إلغاء</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
