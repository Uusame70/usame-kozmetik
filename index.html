<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الحديث</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <div class="nav-container">
            <div class="logo" id="ui-logo">متجري<span>.</span></div>
            <div class="nav-right">
                <div class="settings-btn" id="btn-settings">
                    <i class="fa-solid fa-sliders"></i> <span id="ui-settings-text">الإعدادات</span>
                </div>
                <div class="cart-status" id="btn-cart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="ui-cart-label">السلة</span>: <span id="sepet-sayi">0</span> | <span id="toplam-fiyat">0</span> <span id="ui-currency">ليرة</span>
                </div>
            </div>
        </div>
    </header>

    <main class="hero">
        <div class="container">
            <h2 id="ui-hero-title">تشكيلة الموسم الجديد</h2>

            <div id="admin-panel" class="admin-panel">
                <h3 id="form-baslik">🛠️ لوحة التحكم: إضافة منتج جديد</h3>
                <input type="hidden" id="edit-urun-id">
                <input type="text" id="yeni-ad" placeholder="اسم المنتج"><br>
                <input type="number" id="yeni-fiyat" placeholder="السعر"><br>
                <textarea id="yeni-aciklama" placeholder="وصف المنتج"></textarea><br>
                <label id="ui-file-label">اختر الصور (الحد الأقصى 10): </label><br>
                <input type="file" id="yeni-resim-files" accept="image/*" multiple><br><br>
                <div class="admin-panel-btns">
                    <button id="btn-urun-kaydet" class="btn-save">إضافة المنتج</button>
                    <button id="btn-iptal" class="btn-cancel" style="display:none;">إلغاء</button>
                </div>
            </div>

            <div class="product-grid" id="urun-listesi"></div>
        </div>
    </main>

    <div id="settings-modal" class="modal">
        <div class="modal-box modal-small">
            <h3 id="ui-settings-title">الإعدادات / Ayarlar</h3>
            <p id="ui-lang-select-desc">اختر لغة التطبيق / Uygulama Dilini Seçin</p>
            <button id="btn-lang-ar" class="btn-lang btn-lang-active">العربية (Arapça)</button>
            <button id="btn-lang-tr" class="btn-lang">Türkçe (Türkçe)</button>
            <button id="btn-close-settings" class="btn-close">إغلاق</button>
        </div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-box">
            <div class="detail-img-box">
                <img id="detail-main-img" src="" alt="">
            </div>
            <div id="detail-thumbs" class="gallery-thumbs"></div>
            <h3 id="detail-title"></h3>
            <p id="detail-price" class="detail-price-text"></p>
            <div id="detail-desc" class="detail-desc"></div>
            <button id="detail-add-cart-btn" class="btn-primary">إضافة إلى السلة</button>
            <button id="btn-close-detail" class="btn-close" style="margin-top:8px;">إغلاق</button>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-box">
            <h3 id="ui-cart-modal-title">🛍️ المنتجات في سلتك</h3>
            <div id="sepet-icerik"></div>
            <div class="cart-divider"></div>
            <div class="cart-total-row">
                <span id="ui-total-label">المجموع الكلي:</span>
                <span><span id="sepet-modal-toplam">0</span> <span class="curr-text">ليرة</span></span>
            </div>
            <button id="btn-order" class="btn-primary">إتمام الطلب</button>
            <button id="btn-clear-cart" class="btn-danger">إفراغ السلة</button>
            <button id="btn-close-cart" class="btn-close">إغلاق</button>
        </div>
    </div>

</body>
</html>
